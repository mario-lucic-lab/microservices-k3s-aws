apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gemini-service
  template:
    metadata:
      labels:
        app: gemini-service
    spec:
      containers:
        - name: gemini-service
          image: mario545/gemini-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GOOGLE_API_KEY
