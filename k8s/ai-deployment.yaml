apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: mario545/ai-service:latest
          ports:
            - containerPort: 8000

